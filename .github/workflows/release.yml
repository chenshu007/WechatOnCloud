name: no-chromium-release
# Manual only. Never writes a generic latest, and never deploys.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Custom version, e.g. 1.5.0-no-chromium.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: no-chromium-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'chenshu007/WechatOnCloud' && github.ref == 'refs/heads/no-chromium'
    timeout-minutes: 60
    environment: no-chromium-release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - name: Validate, build and smoke the exact pair
        env:
          WOC_VERSION: ${{ inputs.version }}
          WOC_PLATFORM: linux/${{ matrix.arch }}
          WOC_TEST_DOCKER_ALLOWED: '1'
        run: bash scripts/build-local.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested native artifacts
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for image in woc-panel wechat-on-cloud; do
            ref="ghcr.io/chenshu007/$image"
            docker tag "$ref:$VERSION" "$ref:$VERSION-$ARCH"
            docker push "$ref:$VERSION-$ARCH"
          done
  pair:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: no-chromium-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join both architectures, verify the published pair and record digests
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in woc-panel wechat-on-cloud; do
            ref="ghcr.io/chenshu007/$image"
            docker buildx imagetools create -t "$ref:$VERSION" "$ref:$VERSION-amd64" "$ref:$VERSION-arm64"
          done
          python3 scripts/verify-release-pair.py --version "$VERSION" --sha "$REVISION" --platform linux/amd64 --output release-pair.json
      - uses: actions/upload-artifact@v4
        with:
          name: no-chromium-release-pair
          path: release-pair.json
          retention-days: 90
